<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="//cdn.webix.com/edge/webix.css" type="text/css" charset="utf-8">
        <script src="//cdn.webix.com/edge/webix.js" type="text/javascript" charset="utf-8"></script>

        <style>
        .mainLabel>.webix_el_box{
            font-size: 25px;
        }
        </style>
    </head>
    <body>

        <script type="text/javascript" charset="utf-8">
            //var movies = "http://127.0.0.1:8000/movies/api/movie/";
            
            var reviews = "{% url 'reviews:review-list' %}?content_type=7";
            var tab1 = {
                view:"datatable", id:"datatable1", url: reviews,
                columns:[
                    { id:"id",    header:"",              adjust: true},
                    { id:"text",   header:"review",    adjust: true},
                    { id:"content_object",   header:"to whom",    adjust: true},
                    { id:"created_at",   header:"created at",         adjust: true},
                    { id:"updated_at",   header:"updated at",         adjust: true}
                ],
                select:true,
                autoheight:true,
                scroll: "auto",
                on:{
                    onAfterLoad:function(){
                    this.sort("id", "asc","int");
                    this.markSorting("id", "asc","int");
                    }
                }
            }
            var movies = "{% url 'movies:movie-list' %}";

            var tab = {
                view:"datatable", id:"datatable", url: movies,
                columns:[
                    { id:"id",    header:"",              adjust: true},
                    { id:"title",   header:"title",    adjust: true},
                    { id:"description",   header:"description",    adjust: true},
                    { id:"created_at",   header:"created at",         adjust: true},
                    { id:"updated_at",   header:"updated at",         adjust: true}
                ],
                select:true,
                autoheight:true,
                scroll: "auto",
                on:{
                    onAfterLoad:function(){
                    this.sort("id", "asc","int");
                    this.markSorting("id", "asc","int");
                    },
                    onSelectChange: function(){
                        $$("datatable1").clearAll();
                        $$("btnCreate").enable();
                        webix.ajax().get(reviews,{object_id:this.getSelectedId(false).id}).then(function(result){
                            $$("datatable1").parse(result);
                        })
                        
                    }
                }
            }

            


            var form = {
                view:"form", id:"form1", scroll:false,
                elements:[
                    { view:"textarea", name:"text", label:"Review" },
                    {cols:[
                        { view:"button", value:"Create", id:"btnCreate", width:100, disabled:true,
                            click:function(){ 
                                webix.ajax().post("{% url 'reviews:review-list' %}", {... $$("form1").getValues(), "content_type": 7, "object_id": $$("datatable").getSelectedId(false).id} ).then(function(result){
                                    location.reload();
                                }).fail(function(xhr){
                                    var response = JSON.parse(xhr.response);
                                    webix.message({type: 'error', text: response.error.message});
                                });
                                
                                webix.message("'Create' action");
                            }

                        },
                        { view:"button", value:"Update", width:100,
                            click:function(){
                                webix.ajax().put("{% url 'reviews:review-detail' 0%}?content_type=7".replace("0",$$("datatable1").getSelectedId(false)), $$("form1").getValues()).then(function(result){
                                    location.reload();
                                }).fail(function(xhr){
                                    var response = JSON.parse(xhr.response);
                                    webix.message({type: 'error', text: response.error.message});
                                });
                                webix.message("'Update' action");
                            } 
                        },
                        { view:"button", value:"Delete", width:100,
                            click:function(){ 
                                webix.ajax().del("{% url 'reviews:review-detail' 0%}?content_type=7".replace("0",$$("datatable1").getSelectedId(false))).then(function(result){
                                    location.reload();
                                }).fail(function(xhr){
                                    var response = JSON.parse(xhr.response);
                                    webix.message({type: 'error', text: response.error.message});
                                });
                                webix.message("'Delete' action");
                            } 
                        }
                    ]}
                    
                ]
            };
            var nav = {rows:[{cols:[
                        
                        { view:"button", value:"Movie", adjust: true,
                            click:function(){ 
                                webix.send("/movies/list/", null, "GET");
                            }

                        },
                        { view:"button", value:"Character", adjust: true,
                            click:function(){
                                webix.send("/movies/characters/", null, "GET");
                            } 
                        },
                        { view:"button", value:"Person", adjust: true,
                            click:function(){
                                webix.send("/cast/", null, "GET");
                            } 
                        }
                    ]},{
                            view:"label", 
                            label: "Review", 
                            align:"center",
                            css:"mainLabel"
                        }]}
            webix.ready(function(){
                webix.ui({
                    rows:[
                    {type:"wide", rows:[nav]},{
                        type:"wide", rows:[ tab, tab1 ]
                    },{type:"wide", rows:[ form]}
                    ]
                });

                $$("form1").bind("datatable1")
            })

        </script>
    </body>
</html>
